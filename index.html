<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Leek</title>

    <script>
        const v = Date.now();

        window.LEEK_CDN = "https://cdn.jsdelivr.net/gh/bladetyphoon/leek@latest";
        window.LEEK_RAW = "https://raw.githubusercontent.com/bladetyphoon/leek/main";

        function loadStylesheetWithFallback(cdnUrl, fallbackUrl, timeout = 1000) {
            return new Promise((resolve) => {
                const link = document.createElement("link");
                link.rel = "stylesheet";

                let finished = false;

                function useFallback() {
                    if (finished) return;
                    finished = true;

                    console.warn("CSS fallback triggered");

                    const fallback = document.createElement("link");
                    fallback.rel = "stylesheet";
                    fallback.href = fallbackUrl;

                    document.head.appendChild(fallback);
                    resolve();
                }

                const timer = setTimeout(useFallback, timeout);

                link.onload = () => {
                    if (finished) return;
                    finished = true;
                    clearTimeout(timer);
                    resolve();
                };

                link.onerror = useFallback;

                link.href = cdnUrl;
                document.head.appendChild(link);
            });
        }

        loadStylesheetWithFallback(
            `${LEEK_CDN}/core/styles.css?no_cache=${v}`,
            `${LEEK_RAW}/core/styles.css`
        );
    </script>
</head>

<body>
    <div class="navbar">
        <div class="title">
            <img id="leekImg" src="">
            <p>Leek</p>
            <p class="version">v.0.2</p>
        </div>

        <input
            class="search"
            type="text"
            id="search"
            name="Games"
            placeholder="Search games..."
        >

        <button
            class="refresh-btn"
            id="refreshBtn"
            title="Refresh game list"
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <polyline points="23 4 23 10 17 10"/>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
        </button>
    </div>

    <div class="hstack" id="games"></div>

    <script>
        const logo = document.getElementById("leekImg");

        const logoCDN = `${LEEK_CDN}/core/assets/leek.png?no_cache=${v}`;
        const logoRAW = `${LEEK_RAW}/core/assets/leek.png`;

        let logoFallback = false;

        function useLogoFallback() {
            if (logoFallback) return;
            logoFallback = true;

            console.warn("Logo fallback triggered");
            logo.src = logoRAW;
        }

        const logoTimeout = setTimeout(useLogoFallback, 1000);

        logo.onload = () => clearTimeout(logoTimeout);

        logo.onerror = () => {
            clearTimeout(logoTimeout);
            useLogoFallback();
        };

        logo.src = logoCDN;

        function loadScriptWithFallback(cdnUrl, fallbackUrl, timeout = 1000) {
            const script = document.createElement("script");

            let finished = false;

            function useFallback() {
                if (finished) return;
                finished = true;

                console.warn("Script fallback triggered");

                const fallbackScript = document.createElement("script");
                fallbackScript.src = fallbackUrl;

                document.body.appendChild(fallbackScript);
            }

            const timer = setTimeout(useFallback, timeout);

            script.onload = () => {
                if (finished) return;
                finished = true;
                clearTimeout(timer);
            };

            script.onerror = () => {
                clearTimeout(timer);
                useFallback();
            };

            script.src = cdnUrl;

            document.body.appendChild(script);
        }

        loadScriptWithFallback(
            `${LEEK_CDN}/core/index.js?no_cache=${v}`,
            `${LEEK_RAW}/core/index.js`
        );
    </script>
</body>
</html>
