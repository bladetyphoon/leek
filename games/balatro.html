<!doctype html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, shrink-to-fit=no, minimum-scale=1, maximum-scale=1">

    <title>Balatro</title>

    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/bladetyphoon/leek@main/games/data/theme/love.css">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        body {
            display: flex;
        }

        #canvas,
        #loadingCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #canvas {
            visibility: hidden;
        }
    </style>

    <script>
        window.__getWebDB = function (name) {
            return new Promise((resolve, reject) => {
                var req = indexedDB.open(name, 1);

                req.onupgradeneeded = function (e) {
                    e.target.result.createObjectStore("data");
                };

                req.onsuccess = function (e) {
                    resolve(e.target.result);
                };

                req.onerror = function (e) {
                    reject(e);
                };
            });
        }
    </script>

    <script src="https://cdn.jsdelivr.net/gh/bladetyphoon/leek@main/games/data/consolewrapper.js"></script>
</head>

<body>

    <canvas id="loadingCanvas" oncontextmenu="event.preventDefault()"></canvas>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <script>

        function resizeCanvas() {
            const w = window.innerWidth;
            const h = window.innerHeight;

            const loadingCanvas = document.getElementById("loadingCanvas");
            const gameCanvas = document.getElementById("canvas");

            loadingCanvas.width = w;
            loadingCanvas.height = h;

            gameCanvas.width = w;
            gameCanvas.height = h;
        }

        window.addEventListener("resize", resizeCanvas);
        window.addEventListener("load", resizeCanvas);

        window.callad = () => { /* disabled */ };

        function goFullScreen() {
            var canvas = document.getElementById("canvas");

            if (canvas.requestFullscreen)
                canvas.requestFullscreen();
            else if (canvas.webkitRequestFullscreen)
                canvas.webkitRequestFullscreen();
            else if (canvas.mozRequestFullScreen)
                canvas.mozRequestFullScreen();
        }

        function FullScreenHook() {
            resizeCanvas();
        }

        var loadingContext = document
            .getElementById('loadingCanvas')
            .getContext('2d');

        function drawLoadingText(text) {
            var canvas = loadingContext.canvas;

            loadingContext.fillStyle = "rgb(142, 195, 227)";
            loadingContext.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            loadingContext.font = '2em arial';
            loadingContext.textAlign = 'center';
            loadingContext.fillStyle = "rgb(11, 86, 117)";

            loadingContext.fillText(
                text,
                canvas.width / 2,
                canvas.height / 2
            );
        }

        window.onload = function () {
            resizeCanvas();
            window.focus();
        };

        window.onclick = function () {
            window.focus();
        };

        window.addEventListener("keydown", function (e) {

            if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
                e.preventDefault();
            }

        }, false);

        var Module = {

            arguments: ["./game.love"],

            INITIAL_MEMORY: 256000000,

            printErr: console.error.bind(console),

            canvas: (function () {

                var canvas = document.getElementById('canvas');

                canvas.addEventListener(
                    "webglcontextlost",
                    function (e) {
                        alert('WebGL context lost. You will need to reload the page.');
                        e.preventDefault();
                    },
                    false
                );

                return canvas;

            })(),

            setStatus: function (text) {

                if (text) {

                    drawLoadingText(text);

                } else if (Module.remainingDependencies === 0) {

                    document.getElementById('loadingCanvas').style.display = 'none';

                    document.getElementById('canvas').style.visibility = 'visible';
                }
            },

            totalDependencies: 0,

            remainingDependencies: 0,

            monitorRunDependencies: function (left) {

                this.remainingDependencies = left;

                this.totalDependencies = Math.max(
                    this.totalDependencies,
                    left
                );

                Module.setStatus(
                    left
                        ? 'Preparing... (' +
                        (this.totalDependencies - left) +
                        '/' +
                        this.totalDependencies +
                        ')'
                        : 'All downloads complete.'
                );
            }
        };

        Module.setStatus('Downloading...');

        window.onerror = function () {

            Module.setStatus('Exception thrown, see JavaScript console');

            Module.setStatus = function (text) {
                if (text)
                    Module.printErr('[post-exception status] ' + text);
            };
        };

        var applicationLoad = function () {
            resizeCanvas();
            Love(Module);
        };

    </script>

    <script src="https://cdn.jsdelivr.net/gh/bladetyphoon/leek@main/games/data/game.js"></script>

    <script async src="https://cdn.jsdelivr.net/gh/bladetyphoon/leek@main/games/data/love.js" onload="applicationLoad(this)"></script>

</body>

</html>
